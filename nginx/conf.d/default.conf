# GRI 反向代理规则（P2 阶段 A；M5 AI 垂直收敛）
# 路径约定：
#   /           → portal 壳（静态导航页）
#   /food/      → apps/web（订餐 H5，dev server 5174）
#   /tutor/     → apps/web-ai-tutor（AI 辅导 H5，dev server 5175）
#   /portal/    → apps/portal（组织/运营管理台 H5，dev server 5176）
#   /api/       → services/api（唯一业务后端 3002；tuition 也在此 —— 旧 /tutor-api 已退役）
#   /auth/      → services/auth-center（签发中心 3004，保留前缀）
#   /health     → services/api 存活探针（前缀外，天然豁免鉴权）

server {
    listen       80;
    server_name  _;

    # ── portal 壳（静态，nginx 直接 serve）──
    # index.html 已被 uni-app H5 用作 SPA 模板（/portal/ dev server 消费）；
    # 静态统一入口壳挪到 index.shell.html，`/` 仍 serve 它。
    root  /usr/share/nginx/html/portal;
    index index.html;

    location = / {
        try_files /index.shell.html =404;
    }
    location /portal-assets/ {
        try_files $uri =404;
    }

    # ── 订餐 H5（dev server，反向代理）──
    # 注：dev server 由 docker-compose 的 web 服务暴露 5174；
    #     nginx 容器通过 docker 网络以服务名 `web` 解析。
    location /food/ {
        proxy_pass http://web:5173/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── AI 辅导 H5（dev server，反向代理）──
    location /tutor/ {
        proxy_pass http://web-ai-tutor:5175/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 组织/运营管理台 H5（dev server，反向代理）──
    location /portal/ {
        proxy_pass http://portal:5176/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 统一业务 API（services/api : 3002，M5 收敛）──
    # proxy_read_timeout 180s：exam/analyze 全链（OCR→TutorAgent→出题→计划）真实 LLM 实测 ~107s，
    # 默认 60s 会 504（副作用早已落库，但前端拿到的是网关超时页）。
    location /api/ {
        proxy_pass http://api:3002;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 存活探针（/api 前缀外，天然豁免鉴权）──
    location = /health {
        proxy_pass http://api:3002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── 签发中心 API（services/auth-center : 3004）──
    # 注：auth-center 的 controller 前缀是 /auth（@Controller('auth')），真实路径 /auth/login、/auth/refresh 等。
    #     故 proxy_pass 末**不可**带 `/`（带 `/`=去前缀，会转发成 :3004/login → 404）。
    #     保留前缀原样转发，与前端（auth-client 默认 authBase='/auth'）路径契约一致。
    location /auth/ {
        proxy_pass http://auth-center:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}