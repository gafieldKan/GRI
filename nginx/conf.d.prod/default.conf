# GRI 生产反向代理（docker-compose.prod.yml 将整个 conf.d 挂载此目录）
#
# 拓扑：前端为「构建产物」静态 H5，由 nginx 直接 serve（不再反代 live `npx uni` dev server）；
#   /api、/auth 反代真镜像后端（services/api:3002、services/auth-center:3004）。
#   /  → portal SSO 工作台（302 到 /portal/）
#   /food/   → apps/web 构建产物 dist/build/h5
#   /tutor/  → apps/web-ai-tutor 构建产物 dist/build/h5
#   /portal/ → apps/portal 构建产物 dist/build/h5
#
# TLS：证书自 ./ssl/（prod overlay 挂载 /etc/nginx/ssl）。自签 dev 证书见 scripts/gen-ssl.sh；
#   生产换正式证书：`certbot --nginx -d <域名>` 落盘到挂载点即可热生效（server_name 由 _ 改为域名）。
# 80 → 443 强制跳转；内部上游仅容器网络可达（prod overlay 已收敛宿主端口暴露）。

# 仅容器网络可达的上游（对外只有 nginx 的 80/443）
upstream gri_api  { server api:3002; }
upstream gri_auth { server auth-center:3004; }

# ── HTTP :80 → 强制 HTTPS ──
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS :443 ──
server {
    listen 443 ssl;
    server_name _;
    http2 on;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # 生产：HSTS；自签/dev 阶段可先注释（避免浏览器因自签证书强制缓存 HTTPS 影响本地调试）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── portal 统一入口 ──
    # `/` 固定进入 portal uni-app；未登录由应用路由守卫送到登录/注册页。
    location = / {
        return 302 /portal/;
    }

    # ── 订餐 H5（静态产物）── root 语义：/food/x → /usr/share/nginx/html/food/x
    location /food/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /food/index.html;
        # HTML/入口永不缓存（部署后立即生效，避免浏览器 served stale SPA 壳）；
        # 带内容哈希的静态资源长缓存（内容变则文件名变，可 immutable）。
        add_header Cache-Control "no-cache" always;
        location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|woff2?|ttf|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    # ── AI 辅导 H5（静态产物）──
    location /tutor/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /tutor/index.html;
        add_header Cache-Control "no-cache" always;
        location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|woff2?|ttf|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    # ── 组织/运营管理台 H5（静态产物）──
    location /portal/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
        add_header Cache-Control "no-cache" always;
        location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|woff2?|ttf|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    # ── 统一业务 API（services/api : 3002，M5 收敛）── 保留 /api/ 前缀
    # proxy_read_timeout 180s：exam/analyze 全链（OCR→TutorAgent→出题→计划）真实 LLM 实测 ~107s+，
    # 默认 60s 会 504（副作用早已落库，但前端拿到的是网关超时页）——与 dev conf.d 同款。
    location /api/ {
        proxy_pass http://gri_api;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 存活探针（/api 前缀外，天然豁免鉴权）──
    location = /health {
        proxy_pass http://gri_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── 签发中心 API（services/auth-center : 3004）──
    # 注：auth-center controller 前缀是 /auth，real 路径 /auth/login、/auth/refresh 等，
    #     故 proxy_pass 末**不可**带 `/`（带 `/`=去前缀会 404）。保留前缀原样转发。
    location /auth/ {
        proxy_pass http://gri_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
