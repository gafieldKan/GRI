name: Monorepo CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: gri-api
            path: services/api
          - workspace: gri-auth-center
            path: services/auth-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p ${{ matrix.path }}/tsconfig.json

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: gri
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gri
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test --workspace=gri-api -- --runInBand

  auth-center-test:
    name: Auth Center Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test --workspace=gri-auth-center -- --runInBand

  web-ai-tutor-test:
    name: Web AI Tutor Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:web-ai

  mini-ai-tutor-test:
    name: Mini-Program AI Tutor Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:mini-ai

  nat-proxy-test:
    name: NAT Proxy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node --test tools/nat-proxy/tests/*.test.js

  # 工作区包（packages/*）此前**无 CI 守卫**：plugin-host / agent-core 的 node --test 套件只在本地跑。
  # 它们是宿主底座（W2.3 起 api 依赖 plugin-host），漂移会静默穿透到 API 侧 —— 故补上。
  packages-test:
    name: Packages Tests (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - '@gri/agent-core'
          - '@gri/plugin-host'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 必须 ≥22：脚本用 `--test-force-exit`（22 起），agent-core 的 `.ts` 用例走原生 strip-types。
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test --workspace=${{ matrix.workspace }}

  frontend-build:
    name: Frontend H5 Build (prod artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:all-h5

  docker-build:
    name: Docker Build Gate
    needs: [typecheck, backend-test, auth-center-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f services/api/Dockerfile -t gri-api:ci .
      - name: Build auth-center image
        run: docker build -f services/auth-center/Dockerfile -t gri-auth-center:ci services/auth-center

  migration-bootstrap:
    name: Migration Bootstrap Gate
    needs: [typecheck]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: gri
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-auth:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: gri_auth
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build API and auth-center
        run: |
          npm run build --workspace=gri-api
          npm run build --workspace=gri-auth-center
      - name: Verify migration runner and SQL assets
        run: |
          test -f services/api/dist/migrate/run-migrations.js
          test -f services/auth-center/dist/migrate/run-migrations.js
          api_src="$(find services/api/src/migrate -maxdepth 1 -name '*.sql' | wc -l)"
          api_dist="$(find services/api/dist/migrate -maxdepth 1 -name '*.sql' | wc -l)"
          auth_src="$(find services/auth-center/src/migrate -maxdepth 1 -name '*.sql' | wc -l)"
          auth_dist="$(find services/auth-center/dist/migrate -maxdepth 1 -name '*.sql' | wc -l)"
          test "$api_src" -gt 0
          test "$auth_src" -gt 0
          test "$api_src" = "$api_dist"
          test "$auth_src" = "$auth_dist"
      - name: Apply API migrations from built assets
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gri
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: node services/api/dist/migrate/run-migrations.js
      - name: Apply auth-center migrations from built assets
        env:
          DB_HOST: localhost
          DB_PORT: 5434
          DB_NAME: gri_auth
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: node services/auth-center/dist/migrate/run-migrations.js

  deployment-smoke:
    name: Deployment Smoke Test
    needs: [docker-build, migration-bootstrap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start infrastructure
        run: docker compose up -d postgres postgres-auth redis
      - name: Wait for infrastructure
        run: |
          for _ in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U postgres -d gri >/dev/null 2>&1 &&
              docker compose exec -T postgres-auth pg_isready -U postgres -d gri_auth >/dev/null 2>&1 &&
              [ "$(docker compose exec -T redis redis-cli --raw PING 2>/dev/null | tr -d '\r')" = "PONG" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Start backend and nginx
        run: docker compose up -d --build api auth-center nginx
      - name: Wait for gateway
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost/health | grep -q '"status":"ok"' &&
              curl -fsS http://localhost/auth/jwks | grep -q '"keys"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run read-only health check
        run: bash scripts/health-check.sh
      - name: Stop stack
        if: always()
        run: docker compose down -v
