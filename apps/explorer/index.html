<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRI · 资源定位</title>
<style>
  /* GRI 注入到参考顶栏的控件（作用域限 .gri-*） */
  .gri-controls{display:flex;align-items:center;gap:12px;margin-left:auto}
  .gri-tabs{display:flex;gap:4px;background:#e9f4ed;padding:3px;border-radius:8px}
  .gri-tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;color:#5f6b65;cursor:pointer}
  .gri-tabs button.on{background:#fff;color:#1B7A3D;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .gri-sso{display:flex;align-items:center}
  .gri-sso a,.gri-sso button{border:1px solid #e4ebe6;background:#fff;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:#1a1a2e;text-decoration:none;cursor:pointer;margin-left:6px}
  .gri-sso .primary{background:#1B7A3D;border-color:#1B7A3D;color:#fff}
  .gri-sso .who{font-size:12px;color:#5f6b65;margin-right:4px}
  .gri-loading{position:fixed;inset:0;display:grid;place-items:center;color:#5f6b65;font-size:14px;background:#f4fcf5;z-index:9999}
  /* GRI 治理层：新建弹窗 + 审计流水面板（作用域限 .gri-*） */
  .gri-modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(16,32,22,.45);z-index:10000}
  .gri-modal .gri-card{background:#fff;border-radius:12px;padding:20px;width:min(420px,92vw);box-shadow:0 16px 48px rgba(0,0,0,.22);font-size:13px;color:#1a1a2e}
  .gri-modal h3{margin:0 0 4px;font-size:15px}
  .gri-modal .gri-sub{font-size:11px;color:#8a968f;line-height:1.5;margin-bottom:10px}
  .gri-modal label{display:block;font-size:12px;color:#5f6b65;margin:10px 0 4px}
  .gri-modal input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #e4ebe6;border-radius:7px;font-size:13px;color:#1a1a2e;background:#fbfdfc}
  .gri-modal input:focus{outline:2px solid #cfe8da;border-color:#1B7A3D}
  .gri-modal .gri-msg{font-size:12px;margin-top:10px;min-height:16px;color:#c0392b;word-break:break-all}
  .gri-modal .gri-row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .gri-modal button{border:1px solid #e4ebe6;background:#fff;padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;color:#1a1a2e;cursor:pointer}
  .gri-modal button.gri-ok{background:#1B7A3D;border-color:#1B7A3D;color:#fff}
  .gri-modal button[disabled]{opacity:.6;cursor:default}
  .gri-panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,96vw);background:#fff;z-index:10000;box-shadow:-10px 0 44px rgba(0,0,0,.2);display:flex;flex-direction:column;font-size:12px;color:#1a1a2e}
  .gri-panel header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eef3ef;font-size:14px}
  .gri-panel header button{border:0;background:transparent;font-size:16px;color:#5f6b65;cursor:pointer}
  .gri-panel .gri-list{overflow:auto;padding:4px 16px 20px}
  .gri-log{border-bottom:1px solid #f1f5f2;padding:10px 0;line-height:1.5}
  .gri-log .gri-l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .gri-log .gri-op{font-weight:700;font-size:11px;padding:1px 7px;border-radius:99px;background:#eef3ef;color:#41564a}
  .gri-log .gri-op.create{background:#e6f4ec;color:#1B7A3D}
  .gri-log .gri-op.update{background:#eaf1fb;color:#2f5fa8}
  .gri-log .gri-op.move{background:#fdf3e3;color:#9a6b1f}
  .gri-log .gri-op.archive{background:#fbeaea;color:#a83a3a}
  .gri-log .gri-src{font-size:11px;color:#8a968f}
  .gri-log .gri-time{margin-left:auto;font-size:11px;color:#8a968f;white-space:nowrap}
  .gri-log .gri-l2{color:#5f6b65;font-size:11px;margin-top:3px;word-break:break-all}
  .gri-panel .gri-empty{color:#8a968f;padding:20px 0;text-align:center}
  /* 资源维度：UN CPC 原生树（与 ?dim=resource 同文档） */
  .gri-resource-topbar{display:flex;align-items:center;gap:14px;min-height:58px;padding:0 20px;box-sizing:border-box;background:#fff;border-bottom:1px solid #e6ebe7;position:relative;z-index:2}
  .gri-resource-brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .gri-resource-brand b{font-size:16px;color:#1a1a2e}
  .gri-resource-brand span{font-size:12px;color:#5f6b65}
  .gri-resource-shell{display:grid;grid-template-columns:minmax(360px,46%) 1fr;min-height:calc(100vh - 58px);background:#f4fcf5}
  .gri-resource-tree{height:calc(100vh - 58px);overflow:auto;padding:10px 8px 28px;border-right:1px solid #e6ebe7;background:#fff}
  .gri-resource-tree .tree-row{display:flex;align-items:center;gap:7px;min-height:28px;padding:3px 8px;border-radius:6px;font-size:12px;color:#26382e;cursor:pointer;white-space:nowrap}
  .gri-resource-tree .tree-row:hover{background:#f1f8f4}
  .gri-resource-tree .tree-row.current{background:#e6f4ec;color:#11562c}
  .gri-resource-tree .gri-expander{width:16px;height:16px;padding:0;border:0;background:transparent;color:#7b8a82;font-size:10px;line-height:16px;cursor:pointer;flex:0 0 auto}
  .gri-resource-tree .gri-expander[disabled]{cursor:default;color:#c4cec8}
  .gri-resource-tree .node-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#6e7d75;flex:0 0 auto}
  .gri-resource-tree .node-name{overflow:hidden;text-overflow:ellipsis}
  .gri-resource-tree .node-level{margin-left:auto;font-size:10px;color:#93a19a;flex:0 0 auto}
  .gri-resource-detail{min-width:0;padding:28px 32px;overflow:auto}
  .gri-resource-detail .gri-kicker{font-size:11px;font-weight:700;color:#1B7A3D;letter-spacing:.04em;text-transform:uppercase}
  .gri-resource-detail h1{margin:7px 0 4px;font-size:26px;line-height:1.25;color:#1a1a2e}
  .gri-resource-detail .gri-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;color:#5f6b65}
  .gri-resource-detail dl{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;margin:26px 0 0;font-size:13px}
  .gri-resource-detail dt{color:#8a968f}
  .gri-resource-detail dd{margin:0;color:#26382e;word-break:break-word}
  .gri-resource-empty{color:#8a968f;padding:18px;font-size:13px}
  @media (max-width:760px){
    .gri-resource-topbar{padding:0 12px;flex-wrap:wrap}
    .gri-resource-shell{grid-template-columns:1fr}
    .gri-resource-tree{height:52vh;border-right:0;border-bottom:1px solid #e6ebe7}
    .gri-resource-detail{padding:20px 16px;min-height:calc(48vh - 58px)}
  }
</style>
</head>
<body>
<div class="gri-loading" id="griLoading">正在加载「域览」浏览器…</div>
<script>
/* GRI 内嵌加载器（方案 B）：把参考文件「域览」整体并入本文档（非 iframe），
   并把 GRI 的维度切换 + SSO 注入其顶栏。切换维度用 ?dim= 重载（仍同文档、无 iframe）。 */
(function () {
  'use strict';
  var requestedDim = new URLSearchParams(location.search).get('dim');
  var dim = (requestedDim === 'industry' || requestedDim === 'resource') ? requestedDim : 'region';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function token(){ try { return JSON.parse(localStorage.getItem('gri-auth-token')||'null'); } catch(e){ return null; } }

  function injectControls(){
    var topbar = document.querySelector('.topbar');
    if (!topbar) return;
    if (topbar.querySelector('.gri-controls')) return;
    var box = document.createElement('div');
    box.className = 'gri-controls';
    box.innerHTML = '<span class="gri-tabs">'
      + '<button data-dim="region"' + (dim==='region'?' class="on"':'') + '>区域</button>'
      + '<button data-dim="industry"' + (dim==='industry'?' class="on"':'') + '>行业</button>'
      + '<button data-dim="resource"' + (dim==='resource'?' class="on"':'') + '>资源</button>'
      + '</span><span class="gri-sso" id="griSso"></span>';
    topbar.appendChild(box);
    box.querySelectorAll('.gri-tabs button').forEach(function (b) {
      b.onclick = function () { location.href = '/explore/?dim=' + encodeURIComponent(b.getAttribute('data-dim')); };
    });
    renderSso();
  }

  // 当前维度（从 URL ?dim=）
  function curDim(){
    var d = new URLSearchParams(location.search).get('dim');
    return (d === 'industry' || d === 'resource') ? d : 'region';
  }
  function dimLabel(d){ return d === 'industry' ? '行业' : (d === 'resource' ? '资源' : '区域'); }
  // 当前选中节点 id（region 用 window.Atlas.current()；industry 读树当前行 .node-code）
  function currentId(){
    try { if (window.Atlas && typeof window.Atlas.current === 'function') { var n = window.Atlas.current(); if (n && n.id != null) return String(n.id); } } catch (e) {}
    var row = document.querySelector('.tree-row.current');
    if (row) { var c = row.querySelector('.node-code'); if (c) return c.textContent.trim(); }
    return null;
  }
  async function editCurrent(){
    var t = token();
    if (!t || !t.accessToken) { alert('请先登录（右上）'); return; }
    var id = currentId();
    if (!id) { alert('未定位到当前节点：请先在左侧树上选中一个节点'); return; }
    var dim = curDim();
    var name = prompt('修改名称（' + dim + ' · ' + id + '）：', '');
    if (name == null || !String(name).trim()) return;
    try {
      var r = await fetch('/api/taxonomy/' + dim + '/node/' + encodeURIComponent(id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t.accessToken },
        body: JSON.stringify({ name: String(name).trim() }),
      });
      if (r.ok) { alert('已更新，刷新后生效'); location.reload(); }
      else { var e = await r.json().catch(function(){ return {}; }); alert('失败：' + (e.message || r.status)); }
    } catch (err) { alert('请求失败：' + err.message); }
  }

  async function moveCurrent(){
    var t = token(); if (!t || !t.accessToken) { alert('请先登录（右上）'); return; }
    var id = currentId(); if (!id) { alert('请先在左侧树上选中一个节点'); return; }
    var dim = curDim();
    var parent = prompt('移动到新父级（' + dim + ' 父节点 id，留空=移到根）：', '');
    if (parent == null) return;
    try {
      var r = await fetch('/api/taxonomy/' + dim + '/node/' + encodeURIComponent(id) + '/move', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t.accessToken },
        body: JSON.stringify({ parentId: String(parent).trim() || null }),
      });
      if (r.ok) { alert('已移动，刷新后生效'); location.reload(); }
      else { var e = await r.json().catch(function(){ return {}; }); alert('失败：' + (e.message || r.status)); }
    } catch (err) { alert('请求失败：' + err.message); }
  }
  async function archiveCurrent(){
    var t = token(); if (!t || !t.accessToken) { alert('请先登录（右上）'); return; }
    var id = currentId(); if (!id) { alert('请先在左侧树上选中一个节点'); return; }
    var dim = curDim();
    if (!confirm('确认归档（停用）节点 ' + dim + ' · ' + id + ' ？')) return;
    try {
      var r = await fetch('/api/taxonomy/' + dim + '/node/' + encodeURIComponent(id) + '/archive', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + t.accessToken },
      });
      if (r.ok) { alert('已归档，刷新后生效'); location.reload(); }
      else { var e = await r.json().catch(function(){ return {}; }); alert('失败：' + (e.message || r.status)); }
    } catch (err) { alert('请求失败：' + err.message); }
  }

  async function commandCurrent(){
    var t = token(); if (!t || !t.accessToken) { alert('请先登录（右上）'); return; }
    var text = prompt('AI 命令（示例：把行业 A 改名为 农林牧渔 / 把 011 移到 B / 归档 01）：', '');
    if (!text || !String(text).trim()) return;
    var H = { 'Content-Type': 'application/json', 'Authorization': ('Bea'+'rer') + ' ' + t.accessToken };
    try {
      var r = await fetch('/api/taxonomy/command', { method: 'POST', headers: H, body: JSON.stringify({ text: String(text).trim() }) });
      var d = await r.json().catch(function(){ return {}; });
      if (!r.ok) { alert('解析失败：' + (d.message || r.status)); return; }
      var pv = (d.preview || []).map(function(x){ return x.dimension + ' ' + x.op + ' ' + x.id + (x.name ? (' → ' + x.name) : '') + (x.parentId ? (' → 父 ' + x.parentId) : ''); }).join('\n');
      if (!confirm('提案（解析自 ' + d.parsedBy + '）:\n' + pv + '\n\n确认应用？')) return;
      var r2 = await fetch('/api/taxonomy/command/apply', { method: 'POST', headers: H, body: JSON.stringify({ planId: d.planId }) });
      var d2 = await r2.json().catch(function(){ return {}; });
      if (r2.ok) { alert('已应用 ' + d2.applied + ' 项，刷新后生效'); location.reload(); }
      else { alert('应用失败：' + (d2.message || r2.status)); }
    } catch (err) { alert('请求失败：' + err.message); }
  }

  // ── GRI 治理层（P4-B）：新建节点 + 审计流水（按钮仅 operator 可见，见 renderSso）──
  var CREATE_RULE_HINT = {
    region: 'region 仅可新建 country/province 级：父级 world/subregion/intermediate → country；父级 country → province',
    industry: 'industry 仅可新建 section 级：父级须为 system 层节点（如 ISIC Rev.5）',
    resource: 'resource 仅可新建 division/group/class/subclass 级：父级须为 section/division/group/class 层节点',
  };
  function authHeader(t){ return { 'Content-Type': 'application/json', 'Authorization': ('Bea'+'rer') + ' ' + t.accessToken }; }
  function errText(d, status){
    if (d && d.message) return Array.isArray(d.message) ? d.message.join('；') : String(d.message);
    return 'HTTP ' + status;
  }
  function fmtTime(v){
    if (!v) return '';
    var d = new Date(v);
    return isNaN(d.getTime()) ? String(v) : d.toLocaleString('zh-CN', { hour12: false });
  }
  function brief(v){
    if (v === null || v === undefined) return '';
    var s = typeof v === 'string' ? v : JSON.stringify(v);
    return s && s.length > 160 ? s.slice(0, 160) + '…' : String(s || '');
  }
  // before → after 变更摘要（逐字段比对；无字段差异时退化为 after 全量）
  function diffText(before, after){
    var b = before && typeof before === 'object' ? before : {};
    var a = after && typeof after === 'object' ? after : {};
    var keys = Object.keys(a).concat(Object.keys(b)).filter(function (k, i, arr) { return arr.indexOf(k) === i; });
    var parts = [];
    for (var i = 0; i < keys.length && parts.length < 5; i++) {
      var k = keys[i], bv = brief(b[k]), av = brief(a[k]);
      if (bv === av) continue;
      parts.push(k + '：' + (bv || '∅') + ' → ' + (av || '∅'));
    }
    return parts.length ? parts.join('；') : brief(a);
  }
  function logRow(x){
    var op = esc(x.op || '');
    return '<div class="gri-log">'
      + '<div class="gri-l1"><span class="gri-op ' + op + '">' + op + '</span>'
      + '<b>' + esc(x.target_id) + '</b>'
      + '<span class="gri-src">' + esc(x.source || 'manual') + '</span>'
      + '<span class="gri-time">' + esc(fmtTime(x.created_at)) + '</span></div>'
      + '<div class="gri-l2">' + esc(diffText(x.before, x.after)) + '</div>'
      + '</div>';
  }

  // 新建弹窗：父级/编码/名称/简称 → POST /api/taxonomy/:name/node（operator + 审计 op=create）
  function openCreate(){
    var t = token(); if (!t || !t.accessToken) { alert('请先登录（右上）'); return; }
    var dim = curDim();
    var m = document.createElement('div');
    m.className = 'gri-modal';
    m.innerHTML = '<div class="gri-card">'
      + '<h3>＋ 新建' + dimLabel(dim) + '节点</h3>'
      + '<div class="gri-sub">' + esc(CREATE_RULE_HINT[dim] || '') + '</div>'
      + '<label>父级 id（必填）</label><input class="gri-parent" value="' + esc(currentId() || '') + '" placeholder="'
      + (dim === 'region' ? '如 9000030（intermediate）或 100000（country）' : (dim === 'resource' ? '如 0（section）或 01（division）' : '如 ISIC Rev.5')) + '">'
      + '<label>编码（必填，唯一）</label><input class="gri-code" placeholder="'
      + (dim === 'region' ? '如 990000（数字编码）' : (dim === 'resource' ? '如 011（父级 01）' : '如 Z9')) + '">'
      + '<label>名称（必填）</label><input class="gri-name" placeholder="新节点名称">'
      + (dim === 'resource' ? '' : '<label>简称（可选）</label><input class="gri-short">')
      + '<div class="gri-msg"></div>'
      + '<div class="gri-row"><button class="gri-cancel">取消</button><button class="gri-ok">创建</button></div>'
      + '</div>';
    document.body.appendChild(m);

    var msg = m.querySelector('.gri-msg');
    var okBtn = m.querySelector('.gri-ok');
    function close(){ m.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e){ if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    m.querySelector('.gri-cancel').onclick = close;
    m.onclick = function (e) { if (e.target === m) close(); };

    okBtn.onclick = async function () {
      var parentId = m.querySelector('.gri-parent').value.trim();
      var code = m.querySelector('.gri-code').value.trim();
      var name = m.querySelector('.gri-name').value.trim();
      var shortEl = m.querySelector('.gri-short');
      var short = shortEl ? shortEl.value.trim() : '';
      msg.textContent = '';
      if (!parentId || !code || !name) { msg.textContent = '父级、编码、名称为必填项'; return; }
      var body = { code: code, name: name, parentId: parentId };
      if (short) body.short = short;
      okBtn.disabled = true;
      try {
        var r = await fetch('/api/taxonomy/' + dim + '/node', { method: 'POST', headers: authHeader(t), body: JSON.stringify(body) });
        var d = await r.json().catch(function () { return {}; });
        if (r.status === 201) { close(); alert('已创建 ' + dim + ' · ' + (d.id || code) + '，刷新后生效'); location.reload(); return; }
        msg.textContent = '失败（' + r.status + '）：' + errText(d, r.status);
      } catch (err) { msg.textContent = '请求失败：' + err.message; }
      okBtn.disabled = false;
    };
    m.querySelector('.gri-parent').focus();
  }

  // 审计流水面板：GET /api/taxonomy/:name/changes（operator 门禁）
  async function openAudit(){
    var t = token(); if (!t || !t.accessToken) { alert('请先登录（右上）'); return; }
    var dim = curDim();
    var p = document.createElement('div');
    p.className = 'gri-panel';
    p.innerHTML = '<header><b>▤ 审计流水 · ' + dimLabel(dim) + '</b><button title="关闭">✕</button></header>'
      + '<div class="gri-list"><div class="gri-empty">加载中…</div></div>';
    document.body.appendChild(p);
    p.querySelector('header button').onclick = function () { p.remove(); };
    var list = p.querySelector('.gri-list');
    try {
      var r = await fetch('/api/taxonomy/' + dim + '/changes?limit=50', {
        headers: { 'Authorization': ('Bea'+'rer') + ' ' + t.accessToken },
      });
      var d = await r.json().catch(function () { return null; });
      if (!r.ok) { list.innerHTML = '<div class="gri-empty">加载失败：' + esc(errText(d, r.status)) + '</div>'; return; }
      var rows = Array.isArray(d) ? d : ((d && d.rows) || []);
      list.innerHTML = rows.length
        ? rows.map(logRow).join('')
        : '<div class="gri-empty">暂无变更记录</div>';
    } catch (err) {
      list.innerHTML = '<div class="gri-empty">请求失败：' + esc(err.message) + '</div>';
    }
  }

  async function probeOperator(){
    var t = token(); if (!t || !t.accessToken) return false;
    try {
      var r = await fetch('/api/taxonomy/region/changes?limit=1', { headers: { 'Authorization': ('Bea'+'rer') + ' ' + t.accessToken } });
      return r.ok;
    } catch (e) { return false; }
  }
  function renderSso(){
    var t = token(); var sso = document.getElementById('griSso'); if (!sso) return;
    if (t && t.accessToken) {
      var name = (t.user && (t.user.name || t.user.username)) || '已登录';
      sso.innerHTML = '<span class="who">你好，<b>' + esc(name) + '</b></span>'
        + '<a href="/portal/">工作台</a><button class="logout">退出</button>';
      sso.querySelector('.logout').onclick = function(){ localStorage.removeItem('gri-auth-token'); renderSso(); };
      probeOperator().then(function (isOp) {
        var box = sso.querySelector('.gov');
        if (!isOp || box) return;
        box = document.createElement('span'); box.className = 'gov';
        box.innerHTML = '<button class="new">＋ 新建</button><button class="audit">▤ 审计</button><button class="edit">✎ 编辑名称</button><button class="move">⇄ 移动</button><button class="arch">⧗ 归档</button><button class="ai">✦ AI 命令</button>';
        sso.insertBefore(box, sso.querySelector('.logout'));
        box.querySelector('.new').onclick = openCreate;
        box.querySelector('.audit').onclick = openAudit;
        box.querySelector('.edit').onclick = editCurrent;
        box.querySelector('.move').onclick = moveCurrent;
        box.querySelector('.arch').onclick = archiveCurrent;
        box.querySelector('.ai').onclick = commandCurrent;
      });
    } else {
      sso.innerHTML = '<a href="/portal/#/pages/login/login">登录</a>'
        + '<a class="primary" href="/portal/#/pages/register/index">注册</a>';
    }
  }

  // ② GRI 主题：把参考的 teal 调色板并入 GRI 令牌（后注入覆盖参考 :root）
  function injectSkin(){
    if (document.getElementById('griSkin')) return;
    var st = document.createElement('style'); st.id = 'griSkin';
    st.textContent = ':root{'
      + '--teal:#1B7A3D;--teal-dark:#11562c;--tint:#e6f4ec;'   /* GRI food 绿 */
      + '--bg:#f4fcf5;--paper:#ffffff;--ink:#1a1a2e;--muted:#5f6b65;--line:#e6ebe7;'
      + '--gold:#b6935c;'
      + '}'
      /* 地图主色向 GRI 绿靠拢 */
      + '.region:hover,.region.hovered{fill:#1B7A3D!important}'
      + '.map-label{fill:#2c5a3a}'
      + '.map-marker{fill:#1B7A3D}';
    document.head.appendChild(st);
  }

  var RESOURCE_LEVEL_LABELS = {
    section: '大类',
    division: '中类',
    group: '小类',
    class: '细类',
    subclass: '子类',
  };

  function levelLabel(level){
    return RESOURCE_LEVEL_LABELS[level] || level || '节点';
  }

  function renderResourceTree(payload){
    var nodes = payload && Array.isArray(payload.nodes) ? payload.nodes : [];
    if (!nodes.length) throw new Error('资源树为空');

    var byId = new Map();
    var childrenByParent = new Map();
    nodes.forEach(function (node) {
      var id = String(node && node.id != null ? node.id : node && node.code);
      if (!id) return;
      var copy = Object.assign({}, node, { id: id });
      byId.set(id, copy);
    });
    byId.forEach(function (node) {
      var parent = node.parent == null ? null : String(node.parent);
      if (parent == null) return;
      if (!childrenByParent.has(parent)) childrenByParent.set(parent, []);
      childrenByParent.get(parent).push(node);
    });
    childrenByParent.forEach(function (children) {
      children.sort(function (a, b) {
        return String(a.code || a.id).localeCompare(String(b.code || b.id), 'en', { numeric: true });
      });
    });

    var roots = nodes
      .filter(function (node) { return node && node.parent == null; })
      .map(function (node) { return byId.get(String(node.id != null ? node.id : node.code)); })
      .filter(Boolean)
      .sort(function (a, b) {
        return String(a.code || a.id).localeCompare(String(b.code || b.id), 'en', { numeric: true });
      });
    if (!roots.length) throw new Error('资源树缺少根节点');

    document.title = 'GRI · 资源分类（UN CPC Ver.3.0）';
    document.body.className = 'gri-resource-page';
    document.body.innerHTML = ''
      + '<header class="topbar gri-resource-topbar">'
      + '<div class="gri-resource-brand"><b>资源分类</b><span>UN CPC Ver.3.0 · ' + nodes.length + ' 节点</span></div>'
      + '</header>'
      + '<main class="gri-resource-shell">'
      + '<section class="gri-resource-tree" id="griResourceTree" aria-label="UN CPC 资源分类树"></section>'
      + '<aside class="gri-resource-detail" id="griResourceDetail"></aside>'
      + '</main>';
    injectSkin();

    var treeEl = document.getElementById('griResourceTree');
    var detailEl = document.getElementById('griResourceDetail');
    var expanded = new Set(roots.map(function (node) { return node.id; }));
    var selected = roots[0];

    function showDetail(node){
      if (!node) {
        detailEl.innerHTML = '<div class="gri-resource-empty">请选择资源分类节点</div>';
        return;
      }
      var parent = node.parent == null ? null : byId.get(String(node.parent));
      var childCount = (childrenByParent.get(node.id) || []).length;
      detailEl.innerHTML = ''
        + '<div class="gri-kicker">UN CPC Ver.3.0 · ' + esc(levelLabel(node.level)) + '</div>'
        + '<h1>' + esc(node.name) + '</h1>'
        + '<div class="gri-code">' + esc(node.code || node.id) + '</div>'
        + '<dl>'
        + '<dt>编码</dt><dd>' + esc(node.code || node.id) + '</dd>'
        + '<dt>层级</dt><dd>' + esc(node.level || '') + '</dd>'
        + '<dt>父级</dt><dd>' + esc(parent ? ((parent.code || parent.id) + ' · ' + parent.name) : '无（根节点）') + '</dd>'
        + '<dt>直接子级</dt><dd>' + childCount + '</dd>'
        + '</dl>';
    }

    function markCurrent(){
      var currentId = selected ? selected.id : null;
      Array.prototype.forEach.call(treeEl.querySelectorAll('.tree-row'), function (row) {
        row.classList.toggle('current', currentId != null && row.getAttribute('data-id') === currentId);
      });
    }

    function makeRow(node, depth){
      var children = childrenByParent.get(node.id) || [];
      var row = document.createElement('div');
      row.className = 'tree-row';
      row.setAttribute('data-id', node.id);
      row.style.paddingLeft = (8 + depth * 18) + 'px';

      var toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'gri-expander';
      toggle.disabled = children.length === 0;
      toggle.textContent = children.length === 0 ? '·' : (expanded.has(node.id) ? '▾' : '▸');
      toggle.title = children.length ? (expanded.has(node.id) ? '折叠' : '展开') : '无子级';
      toggle.onclick = function (event) {
        event.stopPropagation();
        if (!children.length) return;
        if (expanded.has(node.id)) expanded.delete(node.id);
        else expanded.add(node.id);
        renderTree();
      };

      var code = document.createElement('span');
      code.className = 'node-code';
      code.textContent = node.code || node.id;
      var name = document.createElement('span');
      name.className = 'node-name';
      name.textContent = node.name || '(未命名)';
      var level = document.createElement('span');
      level.className = 'node-level';
      level.textContent = levelLabel(node.level);

      row.appendChild(toggle);
      row.appendChild(code);
      row.appendChild(name);
      row.appendChild(level);
      row.onclick = function () {
        selected = node;
        markCurrent();
        showDetail(node);
      };
      return row;
    }

    function appendBranch(parentEl, node, depth){
      parentEl.appendChild(makeRow(node, depth));
      if (!expanded.has(node.id)) return;
      (childrenByParent.get(node.id) || []).forEach(function (child) {
        appendBranch(parentEl, child, depth + 1);
      });
    }

    function renderTree(){
      treeEl.innerHTML = '';
      roots.forEach(function (root) { appendBranch(treeEl, root, 0); });
      markCurrent();
    }

    renderTree();
    showDetail(selected);
  }

  function loadResource(){
    return fetch('/api/taxonomy/resource/tree', { cache: 'no-cache' })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(function (payload) {
        renderResourceTree(payload);
        injectControls();
      });
  }

  function load(d){
    if (d === 'resource') return loadResource();
    return fetch('./' + d + '.html', { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (raw) {
      var doc = new DOMParser().parseFromString(raw, 'text/html');
      if (doc.title) document.title = 'GRI · ' + doc.title;
      document.querySelectorAll('style[data-gri-embed]').forEach(function (e) { e.remove(); });
      doc.querySelectorAll('style').forEach(function (s) {
        var st = document.createElement('style'); st.setAttribute('data-gri-embed','1'); st.textContent = s.textContent;
        document.head.appendChild(st);
      });
      injectSkin();
      // 收集脚本：数据块（application/json）延后注入；其余收集待执行
      var dataScripts = [], runScripts = [];
      doc.querySelectorAll('script').forEach(function (s) {
        if ((s.getAttribute('type') || '') === 'application/json') {
          dataScripts.push({ id: s.id || '', text: s.textContent });
        } else if (s.textContent.trim()) {
          runScripts.push(s.textContent);
        }
      });
      doc.querySelectorAll('script').forEach(function (s) { s.remove(); });
      // 1) 先铺 body（会清掉 loading）
      document.body.className = doc.body.className || '';
      document.body.innerHTML = doc.body.innerHTML;
      // 2) 数据：优先 API 全树（真源），几何/meta 保留内嵌；失败回退内嵌
      var mainData = dataScripts.find(function (s) { return /-data$/.test(s.id); }) || dataScripts[0];
      fetch('/api/taxonomy/' + d + '/tree', { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (apiTree) {
          if (mainData && apiTree && apiTree.nodes && apiTree.nodes.length) {
            try {
              var obj = JSON.parse(mainData.text);
              var embNodes = obj.nodes || [];
              var codeToId = {};
              embNodes.forEach(function (n) { if (n && n.code != null) codeToId[String(n.code)] = n.id; });
              var mapId = function (v) { var k = String(v); return Object.prototype.hasOwnProperty.call(codeToId, k) ? codeToId[k] : v; };
              if (d === 'industry') {
                // 参考把 system 节点 id 硬编码为 'ISIC5'（≠code），按内嵌 id↔code 映射还原，保参考 JS 不变
                obj.nodes = apiTree.nodes.map(function (n) {
                  return Object.assign({}, n, {
                    id: mapId(n.id),
                    parent: n.parent == null ? null : mapId(n.parent),
                    children: (n.children || []).map(mapId),
                  });
                });
              } else {
                obj.nodes = apiTree.nodes;
              }
              obj.__fromApi = true;
              mainData.text = JSON.stringify(obj);
            } catch (e) {}
          }
          dataScripts.forEach(function (ds) {
            var dj = document.createElement('script'); dj.type = 'application/json'; if (ds.id) dj.id = ds.id; dj.textContent = ds.text;
            document.body.appendChild(dj);
          });
          // 3) 执行主脚本
          var sc = document.createElement('script'); sc.textContent = runScripts.join('\n;\n'); document.body.appendChild(sc);
          // 4) 注入 GRI 控件
          injectControls();
        });
    });
  }

  window.addEventListener('storage', renderSso);
  load(dim).catch(function (e) {
    var ld = document.getElementById('griLoading'); if (ld) ld.textContent = '加载失败：' + e.message;
  });
})();
</script>
