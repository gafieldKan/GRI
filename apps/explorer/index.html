<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRI · 双维度资源定位</title>
<style>
  :root{
    --gri-primary:#1B7A3D; --gri-primary-dk:#11562c; --gri-tint:#e6f4ec;
    --gri-ink:#1a1a2e; --gri-muted:#5f6b65; --gri-bg:#f4fcf5; --gri-line:#e6ebe7; --gri-card:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--gri-ink);background:var(--gri-bg);overflow:hidden}
  .topbar{height:56px;display:flex;align-items:center;gap:20px;padding:0 20px;background:var(--gri-card);border-bottom:1px solid var(--gri-line);position:relative;z-index:10}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:3px;font-size:18px;color:var(--gri-primary)}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:var(--gri-primary);color:#fff;display:grid;place-items:center;font-size:15px}
  .tabs{display:flex;gap:4px;background:var(--gri-tint);padding:4px;border-radius:10px}
  .tabs button{border:0;background:transparent;padding:7px 18px;border-radius:7px;font-size:14px;font-weight:600;color:var(--gri-muted);cursor:pointer}
  .tabs button.active{background:var(--gri-card);color:var(--gri-primary);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .spacer{flex:1}
  .sso{display:flex;align-items:center;gap:10px}
  .sso .btn{border:1px solid var(--gri-line);background:var(--gri-card);padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--gri-ink);cursor:pointer;text-decoration:none;transition:background .15s}
  .sso .btn:hover{background:var(--gri-tint)}
  .sso .btn.primary{background:var(--gri-primary);border-color:var(--gri-primary);color:#fff}
  .sso .btn.primary:hover{background:var(--gri-primary-dk)}
  .sso .who{font-size:13px;color:var(--gri-muted)}
  .sso .who b{color:var(--gri-ink)}
  main{position:relative;height:calc(100vh - 56px)}
  iframe{display:block;width:100%;height:100%;border:0}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--gri-muted);font-size:14px;background:var(--gri-bg);z-index:5}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">◈</span>GRI</div>
    <nav class="tabs">
      <button data-dim="region" class="active">区域</button>
      <button data-dim="industry">行业</button>
    </nav>
    <div class="spacer"></div>
    <div class="sso" id="sso"></div>
  </header>
  <main>
    <div class="loading" id="loading">正在加载「域览」区域地图…</div>
    <iframe id="stage" src="/explore/region.html" title="GRI 维度浏览"></iframe>
  </main>
  <script>
    var SOURCES = { region:'/explore/region.html', industry:'/explore/industry.html' };
    var LABEL = { region:'区域地图', industry:'行业分类' };
    var stage = document.getElementById('stage');
    var loading = document.getElementById('loading');
    document.querySelectorAll('.tabs button').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        var dim = b.dataset.dim;
        loading.style.display = 'grid';
        loading.textContent = '正在加载「域览」' + LABEL[dim] + '…';
        stage.src = SOURCES[dim];
      });
    });
    stage.addEventListener('load', function(){ loading.style.display = 'none'; });

    // SSO：读同源 gri-auth-token（与 portal/各端共享）
    function token(){ try { return JSON.parse(localStorage.getItem('gri-auth-token') || 'null'); } catch(e){ return null; } }
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
    function renderSso(){
      var t = token(); var sso = document.getElementById('sso');
      if (t && t.accessToken){
        var name = (t.user && (t.user.name || t.user.username)) || '已登录';
        sso.innerHTML = '<span class="who">你好，<b>' + escapeHtml(name) + '</b></span>'
          + '<a class="btn" href="/portal/">工作台</a>'
          + '<button class="btn" id="logout">退出</button>';
        document.getElementById('logout').onclick = function(){ localStorage.removeItem('gri-auth-token'); renderSso(); };
      } else {
        sso.innerHTML = '<a class="btn" href="/portal/#/pages/login/login">登录</a>'
          + '<a class="btn primary" href="/portal/#/pages/register/index">注册</a>';
      }
    }
    window.addEventListener('storage', renderSso);
    renderSso();
  </script>
</body>
</html>
