<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRI · 双维度资源定位</title>
<style>
  /* GRI 注入到参考顶栏的控件（作用域限 .gri-*） */
  .gri-controls{display:flex;align-items:center;gap:12px;margin-left:auto}
  .gri-tabs{display:flex;gap:4px;background:#e9f4ed;padding:3px;border-radius:8px}
  .gri-tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;color:#5f6b65;cursor:pointer}
  .gri-tabs button.on{background:#fff;color:#1B7A3D;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .gri-sso{display:flex;align-items:center}
  .gri-sso a,.gri-sso button{border:1px solid #e4ebe6;background:#fff;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:#1a1a2e;text-decoration:none;cursor:pointer;margin-left:6px}
  .gri-sso .primary{background:#1B7A3D;border-color:#1B7A3D;color:#fff}
  .gri-sso .who{font-size:12px;color:#5f6b65;margin-right:4px}
  .gri-loading{position:fixed;inset:0;display:grid;place-items:center;color:#5f6b65;font-size:14px;background:#f4fcf5;z-index:9999}
</style>
</head>
<body>
<div class="gri-loading" id="griLoading">正在加载「域览」双维度浏览器…</div>
<script>
/* GRI 内嵌加载器（方案 B）：把参考文件「域览」整体并入本文档（非 iframe），
   并把 GRI 的维度切换 + SSO 注入其顶栏。切换维度用 ?dim= 重载（仍同文档、无 iframe）。 */
(function () {
  'use strict';
  var dim = new URLSearchParams(location.search).get('dim') || 'region';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function token(){ try { return JSON.parse(localStorage.getItem('gri-auth-token')||'null'); } catch(e){ return null; } }

  function injectControls(){
    var topbar = document.querySelector('.topbar');
    if (!topbar) return;
    if (topbar.querySelector('.gri-controls')) return;
    var box = document.createElement('div');
    box.className = 'gri-controls';
    box.innerHTML = '<span class="gri-tabs">'
      + '<button data-dim="region"' + (dim==='region'?' class="on"':'') + '>区域</button>'
      + '<button data-dim="industry"' + (dim==='industry'?' class="on"':'') + '>行业</button>'
      + '</span><span class="gri-sso" id="griSso"></span>';
    topbar.appendChild(box);
    box.querySelectorAll('.gri-tabs button').forEach(function (b) {
      b.onclick = function () { location.href = '/explore/?dim=' + encodeURIComponent(b.getAttribute('data-dim')); };
    });
    renderSso();
  }

  // 当前维度（从 URL ?dim=）
  function curDim(){ return (new URLSearchParams(location.search).get('dim') === 'industry') ? 'industry' : 'region'; }
  // 当前选中节点 id（region 用 window.Atlas.current()；industry 读树当前行 .node-code）
  function currentId(){
    try { if (window.Atlas && typeof window.Atlas.current === 'function') { var n = window.Atlas.current(); if (n && n.id != null) return String(n.id); } } catch (e) {}
    var row = document.querySelector('.tree-row.current');
    if (row) { var c = row.querySelector('.node-code'); if (c) return c.textContent.trim(); }
    return null;
  }
  async function editCurrent(){
    var t = token();
    if (!t || !t.accessToken) { alert('请先登录（右上）'); return; }
    var id = currentId();
    if (!id) { alert('未定位到当前节点：请先在左侧树上选中一个节点'); return; }
    var dim = curDim();
    var name = prompt('修改名称（' + dim + ' · ' + id + '）：', '');
    if (name == null || !String(name).trim()) return;
    try {
      var r = await fetch('/api/taxonomy/' + dim + '/node/' + encodeURIComponent(id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t.accessToken },
        body: JSON.stringify({ name: String(name).trim() }),
      });
      if (r.ok) { alert('已更新，刷新后生效'); location.reload(); }
      else { var e = await r.json().catch(function(){ return {}; }); alert('失败：' + (e.message || r.status)); }
    } catch (err) { alert('请求失败：' + err.message); }
  }

  async function moveCurrent(){
    var t = token(); if (!t || !t.accessToken) { alert('请先登录（右上）'); return; }
    var id = currentId(); if (!id) { alert('请先在左侧树上选中一个节点'); return; }
    var dim = curDim();
    var parent = prompt('移动到新父级（' + dim + ' 父节点 id，留空=移到根）：', '');
    if (parent == null) return;
    try {
      var r = await fetch('/api/taxonomy/' + dim + '/node/' + encodeURIComponent(id) + '/move', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t.accessToken },
        body: JSON.stringify({ parentId: String(parent).trim() || null }),
      });
      if (r.ok) { alert('已移动，刷新后生效'); location.reload(); }
      else { var e = await r.json().catch(function(){ return {}; }); alert('失败：' + (e.message || r.status)); }
    } catch (err) { alert('请求失败：' + err.message); }
  }
  async function archiveCurrent(){
    var t = token(); if (!t || !t.accessToken) { alert('请先登录（右上）'); return; }
    var id = currentId(); if (!id) { alert('请先在左侧树上选中一个节点'); return; }
    var dim = curDim();
    if (!confirm('确认归档（停用）节点 ' + dim + ' · ' + id + ' ？')) return;
    try {
      var r = await fetch('/api/taxonomy/' + dim + '/node/' + encodeURIComponent(id) + '/archive', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + t.accessToken },
      });
      if (r.ok) { alert('已归档，刷新后生效'); location.reload(); }
      else { var e = await r.json().catch(function(){ return {}; }); alert('失败：' + (e.message || r.status)); }
    } catch (err) { alert('请求失败：' + err.message); }
  }

  async function commandCurrent(){
    var t = token(); if (!t || !t.accessToken) { alert('请先登录（右上）'); return; }
    var text = prompt('AI 命令（示例：把行业 A 改名为 农林牧渔 / 把 011 移到 B / 归档 01）：', '');
    if (!text || !String(text).trim()) return;
    var H = { 'Content-Type': 'application/json', 'Authorization': ('Bea'+'rer') + ' ' + t.accessToken };
    try {
      var r = await fetch('/api/taxonomy/command', { method: 'POST', headers: H, body: JSON.stringify({ text: String(text).trim() }) });
      var d = await r.json().catch(function(){ return {}; });
      if (!r.ok) { alert('解析失败：' + (d.message || r.status)); return; }
      var pv = (d.preview || []).map(function(x){ return x.dimension + ' ' + x.op + ' ' + x.id + (x.name ? (' → ' + x.name) : '') + (x.parentId ? (' → 父 ' + x.parentId) : ''); }).join('\n');
      if (!confirm('提案（解析自 ' + d.parsedBy + '）:\n' + pv + '\n\n确认应用？')) return;
      var r2 = await fetch('/api/taxonomy/command/apply', { method: 'POST', headers: H, body: JSON.stringify({ planId: d.planId }) });
      var d2 = await r2.json().catch(function(){ return {}; });
      if (r2.ok) { alert('已应用 ' + d2.applied + ' 项，刷新后生效'); location.reload(); }
      else { alert('应用失败：' + (d2.message || r2.status)); }
    } catch (err) { alert('请求失败：' + err.message); }
  }

  function renderSso(){
    var sso = document.getElementById('griSso'); if (!sso) return;
    var t = token();
    if (t && t.accessToken) {
      var name = (t.user && (t.user.name || t.user.username)) || '已登录';
      sso.innerHTML = '<span class="who">你好，<b>' + esc(name) + '</b></span>'
        + '<button class="edit">✎ 编辑名称</button><button class="move">⇄ 移动</button><button class="arch">⧗ 归档</button><button class="ai">✦ AI 命令</button>'
        + '<a href="/portal/">工作台</a><button class="logout">退出</button>';
      sso.querySelector('.edit').onclick = editCurrent;
      sso.querySelector('.move').onclick = moveCurrent;
      sso.querySelector('.arch').onclick = archiveCurrent;
      sso.querySelector('.ai').onclick = commandCurrent;
      sso.querySelector('.logout').onclick = function(){ localStorage.removeItem('gri-auth-token'); renderSso(); };
    } else {
      sso.innerHTML = '<a href="/portal/#/pages/login/login">登录</a>'
        + '<a class="primary" href="/portal/#/pages/register/index">注册</a>';
    }
  }

  // ② GRI 主题：把参考的 teal 调色板并入 GRI 令牌（后注入覆盖参考 :root）
  function injectSkin(){
    if (document.getElementById('griSkin')) return;
    var st = document.createElement('style'); st.id = 'griSkin';
    st.textContent = ':root{'
      + '--teal:#1B7A3D;--teal-dark:#11562c;--tint:#e6f4ec;'   /* GRI food 绿 */
      + '--bg:#f4fcf5;--paper:#ffffff;--ink:#1a1a2e;--muted:#5f6b65;--line:#e6ebe7;'
      + '--gold:#b6935c;'
      + '}'
      /* 地图主色向 GRI 绿靠拢 */
      + '.region:hover,.region.hovered{fill:#1B7A3D!important}'
      + '.map-label{fill:#2c5a3a}'
      + '.map-marker{fill:#1B7A3D}';
    document.head.appendChild(st);
  }

  function load(d){
    return fetch('./' + d + '.html', { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (raw) {
      var doc = new DOMParser().parseFromString(raw, 'text/html');
      if (doc.title) document.title = 'GRI · ' + doc.title;
      document.querySelectorAll('style[data-gri-embed]').forEach(function (e) { e.remove(); });
      doc.querySelectorAll('style').forEach(function (s) {
        var st = document.createElement('style'); st.setAttribute('data-gri-embed','1'); st.textContent = s.textContent;
        document.head.appendChild(st);
      });
      injectSkin();
      // 收集脚本：数据块（application/json）延后注入；其余收集待执行
      var dataScripts = [], runScripts = [];
      doc.querySelectorAll('script').forEach(function (s) {
        if ((s.getAttribute('type') || '') === 'application/json') {
          dataScripts.push({ id: s.id || '', text: s.textContent });
        } else if (s.textContent.trim()) {
          runScripts.push(s.textContent);
        }
      });
      doc.querySelectorAll('script').forEach(function (s) { s.remove(); });
      // 1) 先铺 body（会清掉 loading）
      document.body.className = doc.body.className || '';
      document.body.innerHTML = doc.body.innerHTML;
      // 2) 数据：优先 API 全树（真源），几何/meta 保留内嵌；失败回退内嵌
      var mainData = dataScripts.find(function (s) { return /-data$/.test(s.id); }) || dataScripts[0];
      fetch('/api/taxonomy/' + d + '/tree', { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (apiTree) {
          if (mainData && apiTree && apiTree.nodes && apiTree.nodes.length) {
            try {
              var obj = JSON.parse(mainData.text);
              var embNodes = obj.nodes || [];
              var codeToId = {};
              embNodes.forEach(function (n) { if (n && n.code != null) codeToId[String(n.code)] = n.id; });
              var mapId = function (v) { var k = String(v); return Object.prototype.hasOwnProperty.call(codeToId, k) ? codeToId[k] : v; };
              if (d === 'industry') {
                // 参考把 system 节点 id 硬编码为 'ISIC5'（≠code），按内嵌 id↔code 映射还原，保参考 JS 不变
                obj.nodes = apiTree.nodes.map(function (n) {
                  return Object.assign({}, n, {
                    id: mapId(n.id),
                    parent: n.parent == null ? null : mapId(n.parent),
                    children: (n.children || []).map(mapId),
                  });
                });
              } else {
                obj.nodes = apiTree.nodes;
              }
              obj.__fromApi = true;
              mainData.text = JSON.stringify(obj);
            } catch (e) {}
          }
          dataScripts.forEach(function (ds) {
            var dj = document.createElement('script'); dj.type = 'application/json'; if (ds.id) dj.id = ds.id; dj.textContent = ds.text;
            document.body.appendChild(dj);
          });
          // 3) 执行主脚本
          var sc = document.createElement('script'); sc.textContent = runScripts.join('\n;\n'); document.body.appendChild(sc);
          // 4) 注入 GRI 控件
          injectControls();
        });
    });
  }

  window.addEventListener('storage', renderSso);
  load(dim).catch(function (e) {
    var ld = document.getElementById('griLoading'); if (ld) ld.textContent = '加载失败：' + e.message;
  });
})();
</script>
</body>
</html>
