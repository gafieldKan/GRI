# 人教版数学八年级下册教材目录种子（草案——待人工校对）
#
# 用途：k12-curriculum 数据管线的结构输入（目录结构是公开信息）。
#   - import.mjs 读本文件 → 幂等灌库 ontology.textbook / ontology.textbook_chapter
#   - generate.mjs 读本文件 → 按章节批量生成知识点与例题（staging/*.json）
#
# 对齐：人民教育出版社（人教版）义务教育教科书 数学八年级下册（2013 课标版，与已入库上册同口径）。
# 编码约定：math.g8b.pep.chNN（章号沿用印刷章号 16–20）/ math.g8b.pep.chNN.sNN（节）。
#   下册教材 code 加 b 后缀（b=下册）：上册 math.g8.pep 为历史锚定不改（KP code 引用在库），
#   上下册为不同教材行（textbook.code UNIQUE）。
# 红线：目录整理需人工校对后入库 git；章节树 parent 自引用。
#
# ⚠ 校对要点：本草案按 2013 课标版结构整理（与已入库上册同口径，上下册必须同版）；
#   以你手头教材实书目录为准校对。hint 字段：课题学习/选学/易漂移节带语境提示。
#   学科编码：MATH（LOWER → 'math'，命中 k12 本体判别值——import.mjs 闭集门禁验证）。

textbook:
  code: math.g8b.pep
  name: 人教版数学八年级下册
  version: 人教版
  publisher: 人民教育出版社
  subject: MATH
  subjectName: 数学
  grade: G8
chapters:
- code: math.g8b.pep.ch16
  name: 第十六章 二次根式
  order: 1
  children:
  - code: math.g8b.pep.ch16.s01
