- code: math.g8b.pep.ch19
  name: 第十九章 一次函数
  order: 4
  children:
  - code: math.g8b.pep.ch19.s01
    name: 19.1 函数
    order: 1
  - code: math.g8b.pep.ch19.s02
    name: 19.2 一次函数
