    order: 3
- code: math.g8b.pep.ch17
  name: 第十七章 勾股定理
  order: 2
  children:
  - code: math.g8b.pep.ch17.s01
    name: 17.1 勾股定理
    order: 1
  - code: math.g8b.pep.ch17.s02
    name: 17.2 勾股定理的逆定理
    order: 2
- code: math.g8b.pep.ch18
  name: 第十八章 平行四边形
  order: 3
  children:
  - code: math.g8b.pep.ch18.s01
