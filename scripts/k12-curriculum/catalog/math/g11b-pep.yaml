# 人教版数学选择性必修第二册教材目录种子（草案——待人工校对）
#
# 用途：k12-curriculum 数据管线的结构输入（目录结构是公开信息）。
#   - import.mjs 读本文件 → 幂等灌库 ontology.textbook / ontology.textbook_chapter
#   - generate.mjs 读本文件 → 按章节批量生成知识点与例题（staging/*.json）
#
# 对齐：人民教育出版社（人教版A版）普通高中教科书 数学 选择性必修第二册（2019 课标版）。
# 编码约定：math.g11b.pep.chNN（章号沿用印刷章号 4–5）/ math.g11b.pep.chNN.sNN（节）。
# 红线：目录整理需人工校对后入库 git；章节树 parent 自引用。
#
# ⚠ 校对要点：本草案按 2019 课标人教版A版结构整理；章节划分/节名以你手头教材实书目录为准校对。
#   高中「选择性必修」跨三册连续编号（选必一 ch1–3、选必二 ch4–5、选必三 ch6–8）。
#   hint 字段：易漂移节带认知边界提示（防 LLM 生成超学段/大学内容）。
# ⚠ 本册含导数——高中最易超纲章：务必守住「导数不作严格极限定义、不涉及积分」的红线。

textbook:
  code: math.g11b.pep
  name: 人教版数学选择性必修第二册
  version: 人教版A版
  publisher: 人民教育出版社
  subject: MATH
  subjectName: 数学       # 学科展示名（灌 ontology.subject.name / master_data Subject.label）
  grade: G11

chapters:
  - code: math.g11b.pep.ch04
    name: 第四章 数列
    order: 4
    children:
      - code: math.g11b.pep.ch04.s01
        name: 4.1 数列的概念
        order: 1
      - code: math.g11b.pep.ch04.s02
        name: 4.2 等差数列
        order: 2
      - code: math.g11b.pep.ch04.s03
        name: 4.3 等比数列
        order: 3
      - code: math.g11b.pep.ch04.s04
        name: 4.4 数学归纳法
        order: 4
        hint: 高中范围——用数学归纳法证明与正整数 n 有关的等式/不等式；不涉及超限归纳、良序原理或归纳法的形式化逻辑基础

  - code: math.g11b.pep.ch05
    name: 第五章 一元函数的导数及其应用
    order: 5
    children:
      - code: math.g11b.pep.ch05.s01
        name: 5.1 导数的概念及其意义
        order: 1
        hint: 高中范围——以瞬时速度/切线斜率的直观极限引入导数，理解导数的几何意义；不涉及极限的 ε-δ 严格定义、实分析中的极限理论
      - code: math.g11b.pep.ch05.s02
        name: 5.2 导数的运算
        order: 2
        hint: 高中范围——基本初等函数（幂/指数/对数/三角）的导数公式、四则运算与复合函数求导法则；不涉及泰勒展开、高阶导数的级数理论或隐函数求导的严格理论
      - code: math.g11b.pep.ch05.s03
        name: 5.3 导数在研究函数中的应用
        order: 3
        hint: 高中范围——用导数判断单调性、求极值与最值、解决优化问题；不涉及积分（不定/定积分、微积分基本定理）、洛必达法则、多元微积分或微分方程
