# 人教版数学九年级上册教材目录种子（草案——待人工校对）
#
# 用途：k12-curriculum 数据管线的结构输入（目录结构是公开信息）。
#   - import.mjs 读本文件 → 幂等灌库 ontology.textbook / ontology.textbook_chapter
#   - generate.mjs 读本文件 → 按章节批量生成知识点与例题（staging/*.json）
#
# 对齐：人民教育出版社（人教版）义务教育教科书 数学 九年级上册。
# 编码约定：math.g9.pep.chNN（章号沿用印刷章号 21–25）/ math.g9.pep.chNN.sNN（节）。
# 红线：目录整理需人工校对后入库 git；章节树 parent 自引用。
#
# ⚠ 校对要点：本草案按 2013 课标版结构整理（与已入库 math/g7-pep.yaml 同口径）；
#   2024 新版教材章节划分可能不同——以你手头教材实书目录为准校对。

textbook:
  code: math.g9.pep
  name: 人教版数学九年级上册
  version: 人教版
  publisher: 人民教育出版社
  subject: MATH
  subjectName: 数学       # 学科展示名（灌 ontology.subject.name / master_data Subject.label）
  grade: G9

chapters:
  - code: math.g9.pep.ch21
    name: 第二十一章 一元二次方程
    order: 1
    children:
      - code: math.g9.pep.ch21.s01
        name: 21.1 一元二次方程
        order: 1
      - code: math.g9.pep.ch21.s02
        name: 21.2 解一元二次方程
        order: 2
      - code: math.g9.pep.ch21.s03
        name: 21.3 实际问题与一元二次方程
        order: 3

  - code: math.g9.pep.ch22
    name: 第二十二章 二次函数
    order: 2
    children:
      - code: math.g9.pep.ch22.s01
        name: 22.1 二次函数的图象和性质
        order: 1
      - code: math.g9.pep.ch22.s02
        name: 22.2 二次函数与一元二次方程
        order: 2
      - code: math.g9.pep.ch22.s03
        name: 22.3 实际问题与二次函数
        order: 3

  - code: math.g9.pep.ch23
    name: 第二十三章 旋转
    order: 3
    children:
      - code: math.g9.pep.ch23.s01
        name: 23.1 图形的旋转
        order: 1
      - code: math.g9.pep.ch23.s02
        name: 23.2 中心对称
        order: 2
      - code: math.g9.pep.ch23.s03
        name: 23.3 课题学习 图案设计
        order: 3

  - code: math.g9.pep.ch24
    name: 第二十四章 圆
    order: 4
    children:
      - code: math.g9.pep.ch24.s01
        name: 24.1 圆的有关性质
        order: 1
      - code: math.g9.pep.ch24.s02
        name: 24.2 点和圆、直线和圆的位置关系
        order: 2
      - code: math.g9.pep.ch24.s03
        name: 24.3 正多边形和圆
        order: 3
      - code: math.g9.pep.ch24.s04
        name: 24.4 弧长和扇形面积
        order: 4

  - code: math.g9.pep.ch25
    name: 第二十五章 概率初步
    order: 5
    children:
      - code: math.g9.pep.ch25.s01
        name: 25.1 随机事件与概率
        order: 1
      - code: math.g9.pep.ch25.s02
        name: 25.2 用列举法求概率
        order: 2
      - code: math.g9.pep.ch25.s03
        name: 25.3 用频率估计概率
        order: 3
