# 人教版数学一年级下册教材目录种子（草案——待人工校对）
#
# 用途：k12-curriculum 数据管线的结构输入（目录结构是公开信息）。
#   - import.mjs 读本文件 → 幂等灌库 ontology.textbook / ontology.textbook_chapter
#   - generate.mjs 读本文件 → 按章节批量生成知识点与例题（staging/*.json）
#
# 对齐：人民教育出版社（人教版）义务教育教科书 数学一年级下册（2012 教育部审定，2011 课标版）。
# 编码约定：math.g1b.pep.chNN / math.g1b.pep.chNN.sNN。下册 code 加 b 后缀（同初中先例）。
# 红线：目录整理需人工校对后入库 git；章节树 parent 自引用。
#
# ⚠ 校对要点：本草案按 2012 审定版结构整理；以你手头教材实书目录为准校对。
#   hint 字段：低段认知边界提示（防 LLM 生成超学段内容）。

textbook:
  code: math.g1b.pep
  name: 人教版数学一年级下册
  version: 人教版
  publisher: 人民教育出版社
  subject: MATH
  subjectName: 数学
  grade: G1
chapters:
- code: math.g1b.pep.ch01
  name: 第一单元 认识图形（二）
  order: 1
  children:
  - code: math.g1b.pep.ch01.s01
    name: 1. 认识图形（二）
    order: 1
    hint: 平面图形直观辨认：长方形、正方形、三角形、圆、平行四边形；不涉及图形特征证明与对称轴数量
- code: math.g1b.pep.ch02
  name: 第二单元 20以内的退位减法
  order: 2
  children:
  - code: math.g1b.pep.ch02.s01
    name: 1. 十几减9
    order: 1
    hint: 破十法/想加算减口算；不涉及竖式退位（二年级上册学笔算减法）
  - code: math.g1b.pep.ch02.s02
    name: 2. 十几减8、7、6
    order: 2
  - code: math.g1b.pep.ch02.s03
    name: 3. 十几减5、4、3、2
    order: 3
- code: math.g1b.pep.ch03
  name: 第三单元 分类与整理
  order: 3
  children:
  - code: math.g1b.pep.ch03.s01
    name: 1. 分类与整理
    order: 1
    hint: 按单一标准分类并计数、象形统计图初步；不涉及复式统计表与频数分布
- code: math.g1b.pep.ch04
  name: 第四单元 100以内数的认识
  order: 4
  children:
  - code: math.g1b.pep.ch04.s01
    name: 1. 数数 数的组成
    order: 1
  - code: math.g1b.pep.ch04.s02
    name: 2. 数的顺序 比较大小
    order: 2
    hint: 100 以内数的大小比较（数位比较）；不涉及近似数（二年级学「大约」）
  - code: math.g1b.pep.ch04.s03
    name: 3. 整十数加一位数及相应的减法
    order: 3
    hint: 如 30+4、34-4 口算；不涉及两位数加减笔算（二年级学竖式）
- code: math.g1b.pep.ch05
  name: 第五单元 认识人民币
  order: 5
  children:
  - code: math.g1b.pep.ch05.s01
    name: 1. 认识人民币
    order: 1
    hint: 元角分认识与 1 元=10 角、1 角=10 分换算；不涉及小数表示（三年级学小数初步）
  - code: math.g1b.pep.ch05.s02
    name: 2. 简单的计算
    order: 2
    hint: 元角分简单加减（同单位）；不涉及小数加减与找零的多种组合枚举优化
- code: math.g1b.pep.ch06
  name: 第六单元 100以内的加法和减法（一）
  order: 6
  children:
  - code: math.g1b.pep.ch06.s01
    name: 1. 整十数加、减整十数
    order: 1
    hint: 如 20+30、50-20 口算；不涉及两位数笔算
  - code: math.g1b.pep.ch06.s02
    name: 2. 两位数加一位数、整十数
    order: 2
    hint: 不进位口算为主（如 25+2、25+30）；进位（如 25+7）为下学期重点，此处只做基础
  - code: math.g1b.pep.ch06.s03
    name: 3. 两位数减一位数、整十数
    order: 3
    hint: 不退位口算为主（如 35-2、35-20）；退位减法（如 36-8）在二年级上册深化
  - code: math.g1b.pep.ch06.s04
    name: 4. 小括号
    order: 4
    hint: 含小括号的加减混合先算括号内；只限 10 以内与整十数口算范围
  - code: math.g1b.pep.ch06.s05
    name: 5. 解决问题
    order: 5
    hint: 求相差数（多几少几）应用；不涉及乘除法
- code: math.g1b.pep.ch07
  name: 第七单元 找规律
  order: 7
  children:
  - code: math.g1b.pep.ch07.s01
    name: 1. 找规律
    order: 1
    hint: 简单重复排列规律（如颜色/形状循环）；不涉及数列通项与等差数列求和
