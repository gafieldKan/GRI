# 人教版数学必修第二册教材目录种子（草案——待人工校对）
#
# 用途：k12-curriculum 数据管线的结构输入（目录结构是公开信息）。
#   - import.mjs 读本文件 → 幂等灌库 ontology.textbook / ontology.textbook_chapter
#   - generate.mjs 读本文件 → 按章节批量生成知识点与例题（staging/*.json）
#
# 对齐：人民教育出版社（人教版A版）普通高中教科书 数学 必修第二册（2019 课标版）。
# 编码约定：math.g10b.pep.chNN（章号沿用印刷章号 6–10）/ math.g10b.pep.chNN.sNN（节）。
# 红线：目录整理需人工校对后入库 git；章节树 parent 自引用。
#
# ⚠ 校对要点：本草案按 2019 课标人教版A版结构整理；章节划分/节名以你手头教材实书目录为准校对。
#   高中「必修」跨第一、二册连续编号（必修一 ch1–5、必修二 ch6–10）。
#   hint 字段：易漂移节带认知边界提示（防 LLM 生成超学段/大学内容）。

textbook:
  code: math.g10b.pep
  name: 人教版数学必修第二册
  version: 人教版A版
  publisher: 人民教育出版社
  subject: MATH
  subjectName: 数学       # 学科展示名（灌 ontology.subject.name / master_data Subject.label）
  grade: G10

chapters:
  - code: math.g10b.pep.ch06
    name: 第六章 平面向量及其应用
    order: 6
    children:
      - code: math.g10b.pep.ch06.s01
        name: 6.1 平面向量的概念
        order: 1
      - code: math.g10b.pep.ch06.s02
        name: 6.2 平面向量的运算
        order: 2
      - code: math.g10b.pep.ch06.s03
        name: 6.3 平面向量基本定理及坐标表示
        order: 3
      - code: math.g10b.pep.ch06.s04
        name: 6.4 平面向量的应用
        order: 4
        hint: 高中范围——用向量方法解决平面几何（平行/垂直/长度/夹角）与物理中的力、速度合成；不涉及线性空间公理、矩阵表示或张量

  - code: math.g10b.pep.ch07
    name: 第七章 复数
    order: 7
    children:
      - code: math.g10b.pep.ch07.s01
        name: 7.1 复数的概念
        order: 1
      - code: math.g10b.pep.ch07.s02
        name: 7.2 复数的四则运算
        order: 2
      - code: math.g10b.pep.ch07.s03
        name: 7.3 复数的三角表示
        order: 3
        hint: 高中范围——复数的三角形式、模与辐角、复数乘除的几何意义（旋转与伸缩）；不涉及欧拉公式 e^{iθ}、复变函数、解析函数或辐角原理

  - code: math.g10b.pep.ch08
    name: 第八章 立体几何初步
    order: 8
    children:
      - code: math.g10b.pep.ch08.s01
        name: 8.1 基本立体图形
        order: 1
      - code: math.g10b.pep.ch08.s02
        name: 8.2 立体图形的直观图
        order: 2
      - code: math.g10b.pep.ch08.s03
        name: 8.3 简单几何体的表面积与体积
        order: 3
      - code: math.g10b.pep.ch08.s04
        name: 8.4 空间点、直线、平面之间的位置关系
        order: 4
      - code: math.g10b.pep.ch08.s05
        name: 8.5 空间直线、平面的平行
        order: 5
      - code: math.g10b.pep.ch08.s06
        name: 8.6 空间直线、平面的垂直
        order: 6
        hint: 高中范围——线面平行/垂直的判定与性质定理及其证明（综合几何法）；不涉及空间向量坐标法（选必一学）、向量叉积或射影几何

  - code: math.g10b.pep.ch09
    name: 第九章 统计
    order: 9
    children:
      - code: math.g10b.pep.ch09.s01
        name: 9.1 随机抽样
        order: 1
      - code: math.g10b.pep.ch09.s02
        name: 9.2 用样本估计总体
        order: 2
      - code: math.g10b.pep.ch09.s03
        name: 9.3 统计分析案例 公司员工的肥胖情况调查分析
        order: 3
        hint: 高中数学课题——用样本频率分布直方图、百分位数、平均数与方差分析实际数据案例；不涉及统计推断、假设检验、回归建模等高级方法

  - code: math.g10b.pep.ch10
    name: 第十章 概率
    order: 10
    children:
      - code: math.g10b.pep.ch10.s01
        name: 10.1 随机事件与概率
        order: 1
        hint: 高中范围——随机事件、样本空间、古典概型与概率的基本性质；不涉及概率的公理化定义（测度论/柯尔莫哥洛夫公理）或连续型概率的积分刻画
      - code: math.g10b.pep.ch10.s02
        name: 10.2 事件的相互独立性
        order: 2
      - code: math.g10b.pep.ch10.s03
        name: 10.3 频率与概率
        order: 3
