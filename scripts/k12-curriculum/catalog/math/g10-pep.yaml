# 人教版数学必修第一册教材目录种子（草案——待人工校对）
#
# 用途：k12-curriculum 数据管线的结构输入（目录结构是公开信息）。
#   - import.mjs 读本文件 → 幂等灌库 ontology.textbook / ontology.textbook_chapter
#   - generate.mjs 读本文件 → 按章节批量生成知识点与例题（staging/*.json）
#
# 对齐：人民教育出版社（人教版A版）普通高中教科书 数学 必修第一册（2019 课标版）。
# 编码约定：math.g10.pep.chNN（章号沿用印刷章号 1–5）/ math.g10.pep.chNN.sNN（节）。
# 红线：目录整理需人工校对后入库 git；章节树 parent 自引用。
#
# ⚠ 校对要点：本草案按 2019 课标人教版A版结构整理；章节划分/节名以你手头教材实书目录为准校对。
#   高中「必修」跨第一、二册连续编号（必修一 ch1–5、必修二 ch6–10）。
#   hint 字段：易漂移节带认知边界提示（防 LLM 生成超学段/大学内容）。

textbook:
  code: math.g10.pep
  name: 人教版数学必修第一册
  version: 人教版A版
  publisher: 人民教育出版社
  subject: MATH
  subjectName: 数学       # 学科展示名（灌 ontology.subject.name / master_data Subject.label）
  grade: G10

chapters:
  - code: math.g10.pep.ch01
    name: 第一章 集合与常用逻辑用语
    order: 1
    children:
      - code: math.g10.pep.ch01.s01
        name: 1.1 集合的概念
        order: 1
      - code: math.g10.pep.ch01.s02
        name: 1.2 集合间的基本关系
        order: 2
      - code: math.g10.pep.ch01.s03
        name: 1.3 集合的基本运算
        order: 3
      - code: math.g10.pep.ch01.s04
        name: 1.4 充分条件与必要条件
        order: 4
      - code: math.g10.pep.ch01.s05
        name: 1.5 全称量词与存在量词
        order: 5
        hint: 高中范围——全称量词/存在量词的符号表示与否定（∀/∃ 命题的否定）；不涉及谓词演算、形式逻辑系统、真值表与量词推理的严格证明

  - code: math.g10.pep.ch02
    name: 第二章 一元二次函数、方程和不等式
    order: 2
    children:
      - code: math.g10.pep.ch02.s01
        name: 2.1 等式性质与不等式性质
        order: 1
      - code: math.g10.pep.ch02.s02
        name: 2.2 基本不等式
        order: 2
      - code: math.g10.pep.ch02.s03
        name: 2.3 二次函数与一元二次方程、不等式
        order: 3

  - code: math.g10.pep.ch03
    name: 第三章 函数的概念与性质
    order: 3
    children:
      - code: math.g10.pep.ch03.s01
        name: 3.1 函数的概念及其表示
        order: 1
      - code: math.g10.pep.ch03.s02
        name: 3.2 函数的基本性质
        order: 2
      - code: math.g10.pep.ch03.s03
        name: 3.3 幂函数
        order: 3
      - code: math.g10.pep.ch03.s04
        name: 3.4 函数的应用（一）
        order: 4

  - code: math.g10.pep.ch04
    name: 第四章 指数函数与对数函数
    order: 4
    children:
      - code: math.g10.pep.ch04.s01
        name: 4.1 指数
        order: 1
      - code: math.g10.pep.ch04.s02
        name: 4.2 指数函数
        order: 2
      - code: math.g10.pep.ch04.s03
        name: 4.3 对数
        order: 3
      - code: math.g10.pep.ch04.s04
        name: 4.4 对数函数
        order: 4
      - code: math.g10.pep.ch04.s05
        name: 4.5 函数的应用（二）
        order: 5
        hint: 高中范围——用二分法求方程近似解、不同函数模型（一次/指数/对数/幂）的增长差异比较；不涉及数值分析中的收敛阶、牛顿迭代法的严格理论或渐近复杂度记号

  - code: math.g10.pep.ch05
    name: 第五章 三角函数
    order: 5
    children:
      - code: math.g10.pep.ch05.s01
        name: 5.1 任意角和弧度制
        order: 1
      - code: math.g10.pep.ch05.s02
        name: 5.2 三角函数的概念
        order: 2
      - code: math.g10.pep.ch05.s03
        name: 5.3 诱导公式
        order: 3
      - code: math.g10.pep.ch05.s04
        name: 5.4 三角函数的图象与性质
        order: 4
      - code: math.g10.pep.ch05.s05
        name: 5.5 三角恒等变换
        order: 5
      - code: math.g10.pep.ch05.s06
        name: 5.6 函数 y=Asin(ωx+φ)
        order: 6
        hint: 高中范围——y=Asin(ωx+φ) 的图象变换（振幅/周期/相位）与简谐运动模型；不涉及傅里叶级数、傅里叶变换或信号处理
